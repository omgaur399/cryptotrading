<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>Local Trading Dashboard</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js?v=1782040710"></script>
    <script src="lightweight-charts-fallback.js?v=1782915026"></script>
    <script src="toolbar.js?v=1782915026"></script>
    <script src="utils/constants.js?v=1782915027"></script>
    <script src="utils/helpers.js?v=1782915027"></script>
    <script src="services/storage.js?v=1782915027"></script>
    <script src="services/api.js?v=1782915027"></script>
    <script src="services/chart.js?v=1782915027"></script>
    <script src="services/drawing.js?v=1782915027"></script>
    <script src="services/indicator.js?v=1782915027"></script>
    <script src="services/replay.js?v=1782915027"></script>
    <script src="services/modal.js?v=1782915027"></script>
    <script src="services/layout.js?v=1782915027"></script>
    <script src="services/overlay.js?v=1782915027"></script>
    <script src="services/theme.js?v=1782915027"></script>
    <script src="drawing-primitives.js?v=1782915026"></script>
    <link rel="stylesheet" href="styles.css?v=1782150000">
</head>
<body>
    <header class="dashboard-header">
        <div class="brand-block">
            <!-- Logo mark -->
            <div class="brand-logo" aria-hidden="true">
                <svg width="22" height="22" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="32" height="32" rx="7" fill="hsl(215,90%,60%)" opacity="0.18"/>
                    <polyline points="4,22 10,14 16,18 22,8 28,10" stroke="hsl(215,90%,60%)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                    <circle cx="28" cy="10" r="2.5" fill="hsl(145,72%,42%)"/>
                </svg>
            </div>
            <h1>Trading Dashboard</h1>
            <span id="connection-status" class="status-indicator disconnected">Disconnected</span>
        </div>



        <div class="top-controls">
            <label for="chart-count">Charts</label>
            <select id="chart-count">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="4">4</option>
                <option value="6">6</option>
                <option value="8">8</option>
            </select>
            <!-- Notification bell -->
            <button class="header-icon-btn" id="notif-bell-btn" title="Notifications" aria-label="Notifications">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                <span class="notif-badge" id="notif-badge" style="display:none">0</span>
            </button>
            <!-- Watchlist toggle -->
            <button class="header-icon-btn" id="watchlist-toggle-btn" title="Watchlist" aria-label="Toggle Watchlist">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
            <!-- Sync Charts toggle -->
            <button class="header-icon-btn" id="sync-charts-btn" title="Link/Sync Chart Scales (Sync Zoom & Pan)" aria-label="Link Chart Scales">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
            </button>
        </div>
    </header>

    <main class="dashboard-main">
        <div id="drawing-toolbar" class="drawing-toolbar">
            <button class="toolbar-btn active" data-tool="cursor" title="Cursor / Pointer">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 3 10 21 13 13 21 10 3 3"></polygon></svg>
            </button>
            <div class="toolbar-separator"></div>
            <button class="toolbar-btn" data-tool="trendline" title="Trendline">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="20" x2="20" y2="4"></line><circle cx="4" cy="20" r="1.5" fill="currentColor"></circle><circle cx="20" cy="4" r="1.5" fill="currentColor"></circle></svg>
            </button>

            <!-- ── Shape Group with Dropdown ─────────────────────── -->
            <div class="toolbar-group" id="shape-group">
                <div class="toolbar-group-btn-row">
                    <button class="toolbar-btn" id="shape-group-btn" data-tool="rectangle" title="Rectangle">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg>
                    </button>
                    <button class="toolbar-group-arrow" id="shape-group-arrow" title="More shapes">
                        <svg width="8" height="8" viewBox="0 0 8 8" fill="currentColor"><path d="M4 6 L1 2 L7 2 Z"/></svg>
                    </button>
                </div>
                <div class="toolbar-dropdown" id="shape-dropdown">
                    <div class="toolbar-dropdown-item active-tool" data-tool="rectangle">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect></svg>
                        Rectangle
                    </div>
                    <div class="toolbar-dropdown-item" data-tool="longPosition">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="9" rx="1" fill="rgba(34,197,94,0.25)" stroke="#22c55e"></rect><rect x="3" y="12" width="18" height="9" rx="1" fill="rgba(239,68,68,0.25)" stroke="#ef4444"></rect><line x1="12" y1="3" x2="12" y2="21" stroke-dasharray="3 2"></line></svg>
                        Long Position
                    </div>
                    <div class="toolbar-dropdown-item" data-tool="shortPosition">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="9" rx="1" fill="rgba(239,68,68,0.25)" stroke="#ef4444"></rect><rect x="3" y="12" width="18" height="9" rx="1" fill="rgba(34,197,94,0.25)" stroke="#22c55e"></rect><line x1="12" y1="3" x2="12" y2="21" stroke-dasharray="3 2"></line></svg>
                        Short Position
                    </div>
                    <div class="toolbar-dropdown-item" data-tool="priceRange">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="1" fill="rgba(99,102,241,0.15)" stroke="#6366f1"></rect><line x1="12" y1="5" x2="12" y2="10"></line><polyline points="10 7 12 5 14 7"></polyline><line x1="12" y1="14" x2="12" y2="19"></line><polyline points="10 17 12 19 14 17"></polyline></svg>
                        Price Range
                    </div>
                </div>
            </div>

            <button class="toolbar-btn" data-tool="fibonacci" title="Fibonacci Retracement">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="18" x2="20" y2="18"></line></svg>
            </button>
            <button class="toolbar-btn" data-tool="text" title="Text Annotation">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"></polyline><line x1="9" y1="20" x2="15" y2="20"></line><line x1="12" y1="4" x2="12" y2="20"></line></svg>
            </button>
            <div class="toolbar-separator"></div>
            <button class="toolbar-btn" data-tool="hline" title="Horizontal Line (Drawing)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><circle cx="6" cy="12" r="1.5" fill="currentColor"></circle><circle cx="18" cy="12" r="1.5" fill="currentColor"></circle></svg>
            </button>
            <button class="toolbar-btn" data-tool="vline" title="Vertical Line (Drawing)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="3" x2="12" y2="21"></line><circle cx="12" cy="6" r="1.5" fill="currentColor"></circle><circle cx="12" cy="18" r="1.5" fill="currentColor"></circle></svg>
            </button>
            <button class="toolbar-btn" data-tool="buyMarker" title="Buy Marker Annotation">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>
            </button>
            <button class="toolbar-btn" data-tool="sellMarker" title="Sell Marker Annotation">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"></path></svg>
            </button>
            <button class="toolbar-btn" data-tool="priceAlert" title="Price Alert Trigger">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            </button>
            <div class="toolbar-separator"></div>
            <button class="toolbar-btn trash-btn" id="clear-drawings-btn" title="Clear All Drawings">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
            </button>
        </div>
        <div class="dashboard-content">
            <div class="main-charts-wrapper">
                <div id="charts-grid" class="charts-grid layout-4"></div>
                <div id="sidebar-toggle-divider" class="sidebar-toggle-divider" title="Toggle Right Sidebar">
                    <div class="sidebar-toggle-arrow">◀</div>
                </div>
            <aside id="global-right-sidebar" class="global-right-sidebar collapsed" aria-label="Asset Details and Trading">
                <div class="right-sidebar-wrapper sidebar-tabbed">
                    <div class="sidebar-tabs-header">
                        <div class="sidebar-tab active" data-index="0">INFO</div>
                        <div class="sidebar-tab" data-index="1">BOOK</div>
                        <div class="sidebar-tab" data-index="2">TRADE</div>
                    </div>
                    <div class="sidebar-viewport">
                        <div id="sidebar-slider" class="sidebar-slider-tabs">
                            <aside id="asset-info-panel" class="sidebar-panel asset-info-panel">
                                <div class="info-panel-content">
                                    <div id="info-panel-loading" class="info-panel-message">Select a chart to load info...</div>
                                    <div id="info-panel-data" style="display: none;"></div>
                                </div>
                            </aside>
                            <aside id="order-book-panel" class="sidebar-panel order-book-panel">
                                <div class="ob-header">
                                    <div id="ob-symbol-name" class="ob-symbol-name">--</div>
                                    <div class="ob-price-row">
                                        <span id="ob-current-price" class="ob-current-price">--</span>
                                        <span id="ob-24h-change" class="ob-24h-change">--</span>
                                    </div>
                                </div>
                                <div class="ob-col-headers">
                                    <span>Price</span>
                                    <span>Size</span>
                                </div>
                                <div class="ob-scroll-container">
                                    <div id="ob-asks" class="ob-asks"></div>
                                    <div id="ob-spread" class="ob-spread">--</div>
                                    <div id="ob-bids" class="ob-bids"></div>
                                </div>
                            </aside>
                            <aside id="paper-trade-panel" class="sidebar-panel paper-trade-panel"></aside>
                        </div>
                    </div>
                </div>
            </aside>
        </div>
    </main>

    <footer class="status-bar">
        <span id="data-status">Ready</span>
        <div class="status-bar-time-container">
            <span id="timestamp-time"></span>
            <span class="status-bar-tz-wrapper">
                (<span id="global-tz-display">LCL</span><svg class="tz-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg><select id="global-tz-select" class="status-bar-tz-select" title="Change Timezone" aria-label="Timezone Selector"></select>)
            </span>
        </div>
    </footer>

    <!-- Watchlist Panel (right-side collapsible sidebar) -->
    <aside id="watchlist-panel" class="watchlist-panel" aria-label="Watchlist">
        <div class="watchlist-header">
            <span class="watchlist-title">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                WATCHLIST
            </span>
            <button class="watchlist-close-btn" id="watchlist-close-btn" title="Close Watchlist">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
        <div class="watchlist-add-form">
            <div class="wl-search-container" id="wl-search-container">
                <svg class="wl-search-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" id="watchlist-add-input" placeholder="Search to add symbol…" class="watchlist-add-input" autocomplete="off" />
                <div class="wl-search-dropdown" id="wl-search-dropdown"></div>
            </div>
        </div>
        <div class="watchlist-body" id="watchlist-body">
            <div class="watchlist-empty">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.3"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <p>Charts loading…</p>
            </div>
        </div>
            </aside>
        </div>
    </div>
</main>

    <!-- Right-click context menu -->
    <div id="chart-context-menu" class="ctx-menu" role="menu" aria-hidden="true">
        <div class="ctx-menu-header" id="ctx-menu-header">Price: --</div>
        <button class="ctx-item" id="ctx-add-alert" role="menuitem">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            Add Alert at Price
        </button>
        <button class="ctx-item" id="ctx-draw-hline" role="menuitem">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/></svg>
            Draw Horizontal Line
        </button>
        <div class="ctx-separator"></div>
        <button class="ctx-item" id="ctx-copy-price" role="menuitem">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            Copy Price
        </button>
        <button class="ctx-item" id="ctx-copy-symbol" role="menuitem">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            Copy Symbol
        </button>
    </div>

    <script src="services/watchlist.js"></script>
    <script src="script.js"></script>
</body>
</html>
