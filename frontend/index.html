<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Trading Dashboard</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.production.js"></script>
    <script src="lightweight-charts-fallback.js?v=20260607-18"></script>
    <link rel="stylesheet" href="styles.css?v=20260607-18">
</head>
<body>
    <header class="dashboard-header">
        <div class="brand-block">
            <h1>Trading Dashboard</h1>
            <span id="connection-status" class="status-indicator disconnected">Disconnected</span>
        </div>
        <div class="top-controls">
            <label for="chart-count">Charts</label>
            <select id="chart-count">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="4">4</option>
                <option value="6">6</option>
                <option value="8">8</option>
            </select>
        </div>
    </header>

    <main class="dashboard-main">
        <div id="charts-grid" class="charts-grid layout-4"></div>
    </main>

    <footer class="status-bar">
        <span id="data-status">Ready</span>
        <span id="timestamp"></span>
    </footer>

    <script src="script.js?v=20260607-18"></script>
</body>
</html>
